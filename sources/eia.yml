source_id: "eia"
name: "EIA (U.S. Energy Information Administration)"
type: api
owner: "quant-research"
description: >
  Energy market data -- production, consumption, prices, inventories, and
  forecasts across petroleum, natural gas, electricity, coal, and
  renewables. Relevant to commodities and macro/energy research. No
  adapters/data_access/external_apis/eia.md profile exists yet; add one if
  delivery-rule detail (required metadata, revision handling) becomes
  necessary.

domain: ["macro", "commodities"]
access_level: public

quality:
  completeness: high
  timeliness: "varies by series -- weekly (e.g. petroleum status) to annual, per the EIA release calendar"
  known_issues:
    - "revision/vintage behavior not yet assessed for this catalog -- some series (e.g. weekly petroleum status) publish preliminary values later finalized"
  last_assessed: "2026-08-10"

point_in_time:
  supports_asof: false
  revision_policy: "not yet confirmed -- verify preliminary-vs-final revision behavior per series before point-in-time-sensitive use"

connection:
  method: rest_api
  endpoint_or_host: "https://api.eia.gov/v2"
  credential_ref: "EIA_API_KEY"   # required if any eia_* manifest/series is active

documentation_uri: "https://www.eia.gov/opendata/register.php"
status: active

data_contract_refs: []
