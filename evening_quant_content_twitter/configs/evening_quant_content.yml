# Evening Quant Content Workflow Config
#
# Non-posting draft-pack workflow. Platform writes require a future spec with
# explicit approval, identity, and permission controls.

workflow_name: evening_quant_content
version: 1

schedule:
  frequency: daily
  time: "22:30"
  timezone: America/New_York
  scheduler_adapter: adapters/schedulers/cron.md
  scheduler_profile: evening_quant_content_twitter/scheduler/cron.md

platform:
  primary: x
  account_mode: free
  max_post_chars: 280
  max_thread_posts: 8
  require_manual_approval: true
  auto_post_enabled: false

content:
  ideas_per_run: 15
  finished_posts: 5
  thread_drafts: 3
  meme_concepts: 5
  visual_specs: 5
  tone:
    - quant-native
    - contrarian
    - market-aware
    - lightly funny
  avoid:
    - investment_advice
    - unsupported_performance_claims
    - confidential_desk_context
    - client_or_counterparty_details
    - private_position_or_inventory_details

scoring:
  scale: 1_to_5
  weights:
    timeliness: 1.25
    novelty: 1.20
    quant_depth: 1.40
    visual_potential: 1.00
    meme_potential: 0.65
    claim_risk: -1.50

topics:
  include:
    - AI infrastructure
    - equity concentration
    - macro liquidity
    - volatility
    - market microstructure
    - securities finance
    - collateral optimization
    - repo
    - quant research
    - model risk
  priority_bias:
    securities_finance: 1.4
    AI_infrastructure: 1.2
    macro_liquidity: 1.2
    market_microstructure: 1.1

sources:
  freshness_window_hours: 24
  allow_web_research: true
  allow_user_supplied_images: true
  require_source_notes_for_facts: true
  adapters:
    - adapters/data_access/api.md
    - adapters/data_access/market_data.md

review:
  fact_inference_joke_labels: true
  claim_review_required: true
  confidential_info_check: true
  compliance_language_check: true
  source_note_required_for_facts: true

memory:
  workflow: evening_quant_content
  path: evening_quant_content_twitter/memory/evening_quant_content
  prime_before_run: true
  learn_after_run: true

delivery:
  draft_channel: local_file
  adapter: adapters/artifact_delivery/local_file.md
  output_template: evening_quant_content_twitter/templates/docs/evening_quant_draft_pack.md
  runtime_entrypoint: evening_quant_content_twitter/runtime/evening_quant_pipeline.py
  include:
    - ranked_ideas
    - finished_posts
    - thread_drafts
    - meme_concepts
    - visual_specs
    - source_notes
    - review_findings
    - rejected_or_deferred_ideas
